system_name: oracle
phase: 1
split: dev
description: gold_doc_ids as context, Qwen3-8B AWQ via vLLM, strict prompt
models:
  llm:
    name: alphadua/qwen3-8b-awq-community
    base_model: Qwen/Qwen3-8B
    quantization: awq
    where: Kaggle T4, vLLM 0.11.0
    temperature: 0
  embedder: null
  reranker: null
